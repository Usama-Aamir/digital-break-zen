<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline — The Digital Breakroom</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Nunito', system-ui, -apple-system, sans-serif;
      background: linear-gradient(180deg, #f5f7fa 0%, #ede9f7 50%, #fef3e8 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #4a4a6a;
    }
    .card {
      max-width: 420px;
      width: 90%;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 2rem;
      box-shadow: 0 10px 30px -12px rgba(110, 110, 160, 0.25);
      padding: 3rem 2rem;
      text-align: center;
    }
    .icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 1.5rem;
      background: linear-gradient(135deg, #7dd3fc, #c4b5fd);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon svg { width: 40px; height: 40px; }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.75rem; }
    p { font-size: 1rem; line-height: 1.6; margin-bottom: 1.5rem; opacity: 0.8; }
    button {
      display: inline-block;
      padding: 0.75rem 2rem;
      background: linear-gradient(135deg, #7dd3fc, #c4b5fd);
      color: #4a4a6a;
      border: none;
      border-radius: 9999px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg fill="none" stroke="white" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z" />
      </svg>
    </div>
    <h1>You're offline</h1>
    <p>The Digital Breakroom needs an internet connection to load your break activities, watercooler posts, and games.</p>
    <p>Please check your connection and try again.</p>
    <button onclick="window.location.reload()">Try again</button>
  </div>
</body>
</html>
